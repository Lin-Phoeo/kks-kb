<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>500 · 服务开了个小差 · KKS.ARCANE</title>
<meta name="description" content="服务异常 · KKS 渲染档案馆">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<div class="auth-shell err-shell">
  <aside class="auth-brand err-brand">
    <svg class="auth-brand__beam" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="auth-beam-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3f5bff" stop-opacity="0"/>
          <stop offset="30%" stop-color="#5a4bff" stop-opacity=".9"/>
          <stop offset="55%" stop-color="#b64bff" stop-opacity=".95"/>
          <stop offset="80%" stop-color="#4bb6ff" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#3fbfff" stop-opacity="0"/>
        </linearGradient>
        <filter id="auth-beam-f" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.5"/>
        </filter>
      </defs>
      <path d="M -80 720 C 180 580, 240 420, 540 400 S 980 320, 1280 60"
            stroke="url(#auth-beam-g)" stroke-width="3" fill="none"
            filter="url(#auth-beam-f)" stroke-linecap="round"/>
      <path d="M -80 740 C 220 600, 300 440, 580 420 S 1020 340, 1300 80"
            stroke="url(#auth-beam-g)" stroke-width="1" fill="none"
            opacity=".55" stroke-linecap="round"/>
    </svg>

    <div class="auth-brand__topline auth-mono err-topline-bad">KKS.ARCANE // OFF-LINE</div>

    <div class="auth-brand__mid err-mid">
      <div class="err-code auth-mono err-code-bad">500</div>
      <h1 class="err-headline">服务开了个小差</h1>
      <div class="auth-brand__subline auth-mono">ERROR 500 // INTERNAL_FAILURE</div>

      <div class="err-card">
        <p class="err-card__msg">后端刚才摔了一跤。等一会儿再试，或者先回首页问点别的。</p>
        <a href="/" class="auth-submit err-submit">
          <span>回到首页</span>
          <span class="auth-submit__arrow">→</span>
        </a>
      </div>
    </div>

    <div class="auth-brand__cursor auth-mono"><b>_RECOVERING_</b><span class="blink"></span></div>
  </aside>
</div>
</body>
</html>
