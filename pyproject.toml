# Public source runtime dependencies; exact hashes are in requirements.lock.
# The supported and CI-tested interpreter is Python 3.12.
# Native conversion and test tools are optional extras, not application services.

[project]
name = "kks-kb"
version = "0.1.0"
description = "KKS knowledge base (FastAPI app + retrieval)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "markdown>=3.5",
  "numpy>=1.26",
  "jieba>=0.42",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "nh3>=0.2.14",
  "beautifulsoup4==4.15.0",
  "soupsieve>=4.0.0",
]

[project.optional-dependencies]
native-reader = ["mammoth==1.13.0"]
test = [
  "python-docx>=1.2",
  "Pillow>=12",
  "PyMuPDF>=1.26",
  "playwright>=1.55",
  "pip-audit>=2.9",
]
