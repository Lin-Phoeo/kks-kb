name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip check
      - name: Run full isolated synthetic suite
        run: python -B tests/run_tests.py --output test-results/unit
      - name: Audit installed dependencies
        run: python -m pip_audit --format json --output test-results/pip-audit.json
      - name: Check pipeline CLI and shell scripts
        run: |
          python -B -m pipeline.kbpipe --help
          bash -n ops/deploy/backup.sh
          bash -n ops/deploy/restore_check.sh
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verify-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m playwright install --with-deps chromium
      - name: Test browser against synthetic app responses
        run: python -B tests/run_tests.py --browser --output test-results/browser
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
